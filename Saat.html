<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosFlow - ADHD Zaman Görselleştirici</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #12181b;
            color: #f7efd2;
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(71, 92, 108, 0.15);
        }
        @keyframes pulse-gentle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        .breathing {
            animation: pulse-gentle 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6 selection:bg-[#cd8b62] selection:text-white">

    <!-- Üst Bilgi / Durum Çubuğu -->
    <header class="w-full max-w-xl flex justify-between items-center bg-[#1e262c] border border-[#475c6c]/30 px-6 py-4 rounded-2xl glow-effect transition-opacity duration-500">
        <div>
            <h1 class="text-lg font-bold tracking-wide text-[#eed7a1]">ChronosFlow</h1>
            <p class="text-xs text-[#8a8583]">Zamanı soyuttan somuta dönüştüren görsel çapa</p>
        </div>
        <button id="zenToggle" onclick="toggleZen()" class="text-xs bg-[#475c6c]/40 hover:bg-[#475c6c] text-[#f7efd2] px-3 py-2 rounded-xl transition-all border border-[#475c6c]/50">
            Zen Modu: Kapalı
        </button>
    </header>

    <!-- Ana İçerik Alanı: Zaman Görselleştirici -->
    <main class="w-full max-w-xl flex flex-col items-center justify-center my-auto space-y-6 py-4">
        
        <!-- Odak Çapa Metni -->
        <div class="w-full text-center space-y-2">
            <input type="text" id="focusGoal" placeholder="Şu anki odak noktan nedir? (Örn: Raporu bitir)" 
                class="w-full max-w-md bg-transparent text-center text-lg font-medium text-[#eed7a1] placeholder-[#8a8583] border-b border-[#475c6c]/40 focus:border-[#cd8b62] focus:outline-none pb-2 transition-colors">
        </div>

        <!-- Görsel Daire Saat / Progress Ring -->
        <div class="relative flex items-center justify-center breathing">
            <svg class="w-72 h-72 transform -rotate-90">
                <circle cx="144" cy="144" r="120" stroke="#1e262c" stroke-width="16" fill="transparent" />
                <circle id="progressRing" cx="144" cy="144" r="120" stroke="#475c6c" stroke-width="16" fill="transparent" 
                    stroke-dasharray="753.98" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000 ease-linear" />
            </svg>
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="digitalClock" class="text-4xl font-bold tracking-tight text-[#f7efd2]">00:00:00</span>
                <span id="timeRemaining" class="text-xs text-[#8a8583] mt-1 font-medium">Günün Akışı</span>
            </div>
        </div>

        <!-- Pomodoro Kontrol Butonları -->
        <div id="pomoControls" class="hidden flex space-x-3">
            <button onclick="togglePomoPlay()" id="btnPomoPlay" class="px-4 py-2 text-xs font-semibold rounded-xl bg-[#475c6c] text-white hover:bg-[#475c6c]/80 transition-all">Başlat</button>
            <button onclick="resetPomo()" class="px-4 py-2 text-xs font-semibold rounded-xl bg-[#1e262c] border border-[#475c6c]/40 text-[#8a8583] hover:text-[#f7efd2] transition-all">Sıfırla</button>
        </div>

        <!-- Mod Seçiciler -->
        <div class="flex space-x-3 bg-[#1e262c] p-1.5 rounded-2xl border border-[#475c6c]/30">
            <button onclick="setMode('day')" id="btnDay" class="px-4 py-2 text-xs font-semibold rounded-xl bg-[#475c6c] text-white transition-all">24 Saatlik Akış</button>
            <button onclick="setMode('pomo')" id="btnPomo" class="px-4 py-2 text-xs font-semibold rounded-xl text-[#8a8583] hover:text-[#f7efd2] transition-all">25D Odak Bloğu</button>
        </div>

    </main>

    <!-- Alt Bilgi -->
    <footer id="footerNote" class="w-full max-w-xl text-center text-xs text-[#8a8583] py-4 border-t border-[#475c6c]/25 transition-opacity duration-500">
        İpucu: Zaman akıp gitmiyor, renk değiştirerek tükeniyor. Sadece bir sonraki adıma odaklan.
    </footer>

    <!-- JavaScript Mantığı -->
    <script>
        let currentMode = 'day';
        let totalPomoSeconds = 25 * 60;
        let pomoSecondsLeft = totalPomoSeconds;
        let isPomoRunning = false;
        let isZenActive = false;
        const circumference = 753.98;

        function playGentleChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(528, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.5);
            } catch (e) {
                console.log("Audio context not allowed yet.");
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnDay = document.getElementById('btnDay');
            const btnPomo = document.getElementById('btnPomo');
            const pomoControls = document.getElementById('pomoControls');
            
            if (mode === 'day') {
                btnDay.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-[#475c6c] text-white transition-all";
                btnPomo.className = "px-4 py-2 text-xs font-semibold rounded-xl text-[#8a8583] hover:text-[#f7efd2] transition-all";
                pomoControls.classList.add('hidden');
                isPomoRunning = false;
            } else {
                btnPomo.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-[#cd8b62] text-white transition-all";
                btnDay.className = "px-4 py-2 text-xs font-semibold rounded-xl text-[#8a8583] hover:text-[#f7efd2] transition-all";
                pomoControls.classList.remove('hidden');
                pomoSecondsLeft = totalPomoSeconds;
                isPomoRunning = false;
                document.getElementById('btnPomoPlay').innerText = "Başlat";
            }
            updateClock();
        }

        function togglePomoPlay() {
            isPomoRunning = !isPomoRunning;
            const btn = document.getElementById('btnPomoPlay');
            btn.innerText = isPomoRunning ? "Duraklat" : "Devam Et";
        }

        function resetPomo() {
            isPomoRunning = false;
            pomoSecondsLeft = totalPomoSeconds;
            document.getElementById('btnPomoPlay').innerText = "Başlat";
            updateClock();
        }

        function toggleZen() {
            isZenActive = !isZenActive;
            const header = document.querySelector('header');
            const footer = document.getElementById('footerNote');
            const btn = document.getElementById('zenToggle');

            if (isZenActive) {
                header.style.opacity = '0.08';
                footer.style.opacity = '0.08';
                btn.innerText = "Zen Modu: Açık";
            } else {
                header.style.opacity = '1';
                footer.style.opacity = '1';
                btn.innerText = "Zen Modu: Kapalı";
            }
        }

        function updateClock() {
            const digitalClock = document.getElementById('digitalClock');
            const progressRing = document.getElementById('progressRing');
            const timeRemaining = document.getElementById('timeRemaining');

            if (currentMode === 'day') {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                const totalSecondsToday = (hours * 3600) + (minutes * 60) + seconds;
                const totalDaySeconds = 24 * 3600;
                
                digitalClock.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                const ratio = totalSecondsToday / totalDaySeconds;
                progressRing.style.strokeDashoffset = circumference - (ratio * circumference);

                if (ratio < 0.5) {
                    progressRing.style.stroke = '#475c6c'; 
                } else if (ratio < 0.8) {
                    progressRing.style.stroke = '#eed7a1'; 
                } else {
                    progressRing.style.stroke = '#cd8b62'; 
                }

                const hoursLeft = 23 - hours;
                const minsLeft = 59 - minutes;
                timeRemaining.innerText = `Günün bitmesine ~${hoursLeft}s ${minsLeft}d kaldı`;

            } else {
                if (isPomoRunning && pomoSecondsLeft > 0) {
                    pomoSecondsLeft--;
                    if (pomoSecondsLeft === 0) {
                        isPomoRunning = false;
                        document.getElementById('btnPomoPlay').innerText = "Yeniden Başlat";
                        playGentleChime();
                    }
                }

                const pMins = Math.floor(pomoSecondsLeft / 60);
                const pSecs = pomoSecondsLeft % 60;

                digitalClock.innerText = `${String(pMins).padStart(2, '0')}:${String(pSecs).padStart(2, '0')}`;
                
                const pRatio = pomoSecondsLeft / totalPomoSeconds;
                progressRing.style.strokeDashoffset = circumference - (pRatio * circumference);

                if (pRatio > 0.3) {
                    progressRing.style.stroke = '#475c6c';
                } else {
                    progressRing.style.stroke = '#cd8b62';
                }

                timeRemaining.innerText = isPomoRunning ? "Odaklanma Bloğu Aktif" : "Duraklatıldı / Başlamaya Hazır";
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
